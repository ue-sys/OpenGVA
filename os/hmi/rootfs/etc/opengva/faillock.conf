# How wrong PINs are counted on an OpenGVA crew station: pam_faillock's
# configuration, as /etc/pam.d/greetd names it. See faillock.conf(5).

# Where the count is kept: on the disk, so that switching off and on again
# does not wipe the slate. (/usr/libexec/opengva/verifier makes it.)
dir = /var/lib/opengva/faillock

# Five wrong PINs for an account, within a quarter of an hour...
deny = 5
fail_interval = 900

# ...and no PIN is heard for it for a minute: long enough that guessing is
# not worth the while, and not so long that a slip of the fingers costs the
# crew what the PIN was for. Never for good: the count is not for locking a
# crew out of its own vehicle.
unlock_time = 60

# Say in the log whose PIN it was.
audit
